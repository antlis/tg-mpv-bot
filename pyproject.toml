[project]
name = "tg-mpv-bot"
version = "1.3.1"
description = "Telegram remote control for mpv — browse your library, stream links, control playback from your phone"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.18,<4.0",
    "aiohttp>=3.9",
    # Stable baseline so URL playback works after a plain `uv sync`;
    # /mpv_update_ytdlp (and YTDL_UPDATE_DAYS) bump it to the nightly in
    # place, since YouTube breaks extraction faster than stable releases.
    "yt-dlp",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.18",
]
