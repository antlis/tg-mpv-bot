[project]
name = "tg-mpv-bot"
version = "1.11.1"
description = "Telegram remote control for mpv — browse your library, stream links, control playback from your phone"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.30.0,<4.0",
    "aiohttp>=3.14.3",
    "curl_cffi==0.16.3",
    # Headless-browser fallback (the Chromium binary itself is opt-in in the
    # Docker image — INSTALL_BROWSER=true — so this stays a light package).
    "playwright>=1.50",
    # AES for plugins that decrypt player payloads (and yt-dlp encrypted HLS).
    "pycryptodomex",
    # Stable baseline so URL playback works after a plain `uv sync`;
    # /update_ytdlp (and YTDL_UPDATE_DAYS) bump it to the nightly in
    # the place, since YouTube breaks extraction faster than stable releases.
    "yt-dlp",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.2",
]
