name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      # Real mpv for the integration tests in tests/test_real_mpv.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
      - run: uv run ruff check .
      - run: uv run pytest
