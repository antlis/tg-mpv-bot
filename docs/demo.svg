<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="-apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <defs>
    <style>
      .bubble-bot  { fill:#182533; }
      .bubble-user { fill:#2b5278; }
      .btn   { fill:#2f3b4c; stroke:#3d4d63; stroke-width:1; }
      .t     { fill:#f1f5f9; font-size:14px; }
      .tdim  { fill:#9fb3c8; font-size:12px; }
      .tbtn  { fill:#a8c8ec; font-size:13px; text-anchor:middle; }
      .cmd   { fill:#eaf3fb; font-size:14px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="820" height="560" fill="#0e1621"/>
  <text x="410" y="30" text-anchor="middle" class="tdim" font-size="14">tg-mpv-bot — browse your library · control playback · stream links, all from Telegram</text>

  <!-- ───────────── left panel: /mpv_list browse ───────────── -->
  <g>
    <!-- user message -->
    <rect x="240" y="56" width="150" height="34" rx="12" class="bubble-user"/>
    <text x="256" y="78" class="cmd">/mpv_list</text>

    <!-- bot reply -->
    <rect x="30" y="104" width="280" height="34" rx="12" class="bubble-bot"/>
    <text x="46" y="126" class="t">📋 142 playlists — pick a category:</text>

    <!-- category buttons -->
    <rect x="30" y="148" width="360" height="38" rx="8" class="btn"/>
    <text x="210" y="172" class="tbtn">🎨 cartoons (38)</text>
    <rect x="30" y="192" width="360" height="38" rx="8" class="btn"/>
    <text x="210" y="216" class="tbtn">🎬 movie (54)</text>
    <rect x="30" y="236" width="360" height="38" rx="8" class="btn"/>
    <text x="210" y="260" class="tbtn">📺 shows (27)</text>
    <rect x="30" y="280" width="360" height="38" rx="8" class="btn"/>
    <text x="210" y="304" class="tbtn">🎓 tutorials (23)</text>

    <!-- a URL message -->
    <rect x="120" y="342" width="270" height="34" rx="12" class="bubble-user"/>
    <text x="136" y="364" class="cmd">https://youtu.be/dQw4w9WgXcQ</text>

    <rect x="30" y="390" width="330" height="34" rx="12" class="bubble-bot"/>
    <text x="46" y="412" class="t">▶ Streaming: Never Gonna Give You Up</text>

    <!-- finished notification -->
    <rect x="30" y="438" width="330" height="34" rx="12" class="bubble-bot"/>
    <text x="46" y="460" class="t">⏭ Now playing: 6/12 — Deadwood S01E06</text>
  </g>

  <!-- ───────────── right panel: /mpv_info panel ───────────── -->
  <g transform="translate(420,0)">
    <!-- user message -->
    <rect x="240" y="56" width="150" height="34" rx="12" class="bubble-user"/>
    <text x="256" y="78" class="cmd">/mpv_info</text>

    <!-- now-playing panel -->
    <rect x="30" y="104" width="300" height="78" rx="12" class="bubble-bot"/>
    <text x="46" y="128" class="t">🎬 Deadwood S01E05</text>
    <text x="46" y="150" class="t">▶ playing   23:11 / 54:30 (42%)</text>
    <text x="46" y="172" class="t">🔊 85   ▶ 5/12</text>

    <!-- transport row -->
    <g transform="translate(0,192)">
      <rect x="30"  y="0" width="64" height="38" rx="8" class="btn"/><text x="62"  y="24" class="tbtn">⏮</text>
      <rect x="98"  y="0" width="64" height="38" rx="8" class="btn"/><text x="130" y="24" class="tbtn">⏪</text>
      <rect x="166" y="0" width="88" height="38" rx="8" class="btn"/><text x="210" y="24" class="tbtn">⏸ Pause</text>
      <rect x="258" y="0" width="64" height="38" rx="8" class="btn"/><text x="290" y="24" class="tbtn">⏩</text>
      <rect x="326" y="0" width="64" height="38" rx="8" class="btn"/><text x="358" y="24" class="tbtn">⏭</text>
    </g>
    <!-- percent row -->
    <g transform="translate(0,236)">
      <rect x="30"  y="0" width="86" height="38" rx="8" class="btn"/><text x="73"  y="24" class="tbtn">0%</text>
      <rect x="120" y="0" width="86" height="38" rx="8" class="btn"/><text x="163" y="24" class="tbtn">25%</text>
      <rect x="210" y="0" width="86" height="38" rx="8" class="btn"/><text x="253" y="24" class="tbtn">50%</text>
      <rect x="300" y="0" width="90" height="38" rx="8" class="btn"/><text x="345" y="24" class="tbtn">75%</text>
    </g>
    <!-- audio/sub row -->
    <g transform="translate(0,280)">
      <rect x="30"  y="0" width="64" height="38" rx="8" class="btn"/><text x="62"  y="24" class="tbtn">🔉</text>
      <rect x="98"  y="0" width="64" height="38" rx="8" class="btn"/><text x="130" y="24" class="tbtn">🔇</text>
      <rect x="166" y="0" width="64" height="38" rx="8" class="btn"/><text x="198" y="24" class="tbtn">🔊</text>
      <rect x="234" y="0" width="64" height="38" rx="8" class="btn"/><text x="266" y="24" class="tbtn">💬</text>
      <rect x="302" y="0" width="88" height="38" rx="8" class="btn"/><text x="346" y="24" class="tbtn">🎧</text>
    </g>
    <!-- misc row -->
    <g transform="translate(0,324)">
      <rect x="30"  y="0" width="64" height="38" rx="8" class="btn"/><text x="62"  y="24" class="tbtn">🔀</text>
      <rect x="98"  y="0" width="64" height="38" rx="8" class="btn"/><text x="130" y="24" class="tbtn">🔁</text>
      <rect x="166" y="0" width="64" height="38" rx="8" class="btn"/><text x="198" y="24" class="tbtn">⏹</text>
      <rect x="234" y="0" width="156" height="38" rx="8" class="btn"/><text x="312" y="24" class="tbtn">🔄 Refresh</text>
    </g>

    <!-- episode picker teaser -->
    <rect x="240" y="380" width="150" height="34" rx="12" class="bubble-user"/>
    <text x="256" y="402" class="cmd">/mpv_ep</text>
    <rect x="30" y="428" width="300" height="34" rx="12" class="bubble-bot"/>
    <text x="46" y="450" class="t">📜 12 items (now: #5) — tap to jump:</text>
    <rect x="30" y="470" width="360" height="38" rx="8" class="btn"/>
    <text x="210" y="494" class="tbtn">▶ 5. Deadwood S01E05</text>
  </g>

  <text x="410" y="545" text-anchor="middle" class="tdim">left: browse &amp; stream by link · right: now-playing panel and episode picker</text>
</svg>
